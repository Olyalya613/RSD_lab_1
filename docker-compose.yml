name: traveler-lab3
services:
  # PostgreSQL has a private network and a persistent Docker-managed volume.
  postgres:
    image: ${POSTGRES_IMAGE:?Create .env with container/setup-env.ps1}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Missing POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Missing POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 uses /var/lib/postgresql/18/docker by default.
      - pgdata:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    cpus: ${DB_CPUS:-2.0}
    mem_limit: ${DB_MEMORY:-2g}
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # API waits for database readiness and runs as UID 1000, without root.
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?Missing PYTHON_IMAGE}
    image: ${APP_IMAGE:?Missing APP_IMAGE}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Missing DATABASE_URL}
    ports:
      - "127.0.0.1:${APP_PORT:-4567}:4567"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4567/health',timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    cpus: ${WEB_CPUS:-2.0}
    mem_limit: ${WEB_MEMORY:-1g}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  pgdata:
networks:
  backend:
    driver: bridge
